    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Incidencia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='Css/formulario.css') }}" />
    <link rel="icon" href="{{ url_for('static', filename='Css/icono.ico') }}" type="image/x-icon">
    <!-- Vinculando SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-logo">
            <i class="fas fa-ticket-alt"></i>
            <h1>Servicio de Soporte Tio Ammi</h1>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
        <h1 class="page-title">Crear Ticket de Incidencia</h1>

        <div class="form-card">
            <h2>Información de Usuario:</h2>
            <div class="form-section">
                <div class="form-row">
                    <div class="form-group required">
                        <label for="name" class="form-label">Nombre y Apellido</label>
                        <input type="text" class="form-control" id="name" placeholder="Ingrese su nombre" required>
                    </div>
                    <div class="form-group required">
                        <label for="email" class="form-label">Correo Electrónico: <small>(Se enviara un correo para seguimiento)</small></label>
                        <input type="email" class="form-control" id="email" placeholder="ejemplo@tioammi.com.ve" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group required">
                        <label for="department" class="form-label">Departamento</label>
                        <select class="form-control" id="department" required>
                            <option value="" selected disabled>Seleccione un Departamento</option>
                            <option value="Administracion">Administración / Tributos</option>
                            <option value="Recursos-Humanos">Recursos Humanos</option>
                            <option value="Reclutamiento">Reclutamiento y Seleccion</option>
                            <option value="Contabilidad">Contabilidad</option>
                            <option value="Publicidad">Publicidad</option>
                            <option value="Almacen">Almacen</option>
                            <option value="Ventas">Ventas</option>
                            <option value="Inventario">Inventario</option>
                            <option value="Costos">Costos</option>
                            <option value="Compras">Compras</option>
                            <option value="Legal">Legal</option>
                            <option value="Wiwu">Wiwu</option>
                            <option value="Bbrose">Bbrose</option>
                        </select>
                    </div>
                    <div class="form-group required">
                        <label for="incidencia" class="form-label">Detalle de la Incidencia:</label>
                        <select class="form-control" id="incidencia" required>
                            <option value="" selected disabled>Seleccione una Incidencia</option>
                            <option value="Fallas con la PC">Fallas con la PC</option>
                            <option value="Fallas con el Internet">Fallas con el Internet</option>
                            <option value="Problema con Impresora">Problema con Impresora</option>
                            <option value="Problema con Programas (Galac, Stellar, otros)">Problema con Programas (Galac, Stellar, otros)</option>
                            <option value="Otras...">Otras...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-buttons">
